<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모두의 보카 자료실</title>
<style>
  :root {
    --primary: #E8558B;
    --primary-dark: #C13D6D;
    --accent: #FFC93C;
    --background: #FFF8EE;
    --surface: #FFFFFF;
    --text-primary: #1B1D2A;
    --text-secondary: #6B7280;
    --border: #F1E3CC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--background);
    color: var(--text-primary);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-size: 24px;
    font-weight: 800;
    margin: 8px 0 4px;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 20px;
  }
  .guide {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }
  .guide b { color: var(--text-primary); }
  .list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .card .name {
    font-weight: 700;
    font-size: 15px;
    word-break: break-all;
  }
  .card .meta {
    color: var(--text-secondary);
    font-size: 12px;
    margin-top: 2px;
  }
  .btn {
    flex-shrink: 0;
    background: var(--primary);
    color: white;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .btn:active { background: var(--primary-dark); }
  .empty, .error {
    text-align: center;
    color: var(--text-secondary);
    padding: 40px 0;
    font-size: 14px;
  }
  .chip {
    display: inline-block;
    background: var(--accent);
    color: var(--text-primary);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 6px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>📚 모두의 보카 자료실</h1>
    <p class="subtitle">선생님이 올려주신 단어 자료를 다운로드하세요</p>

    <div class="guide">
      <b>사용 방법</b><br>
      1. 아래에서 원하는 자료를 눌러 다운로드하세요<br>
      2. <b>모두의 보카</b> 앱을 열고 "지정 단어" → 오른쪽 위 아이콘(가져오기) → "파일에서 불러오기"를 눌러 방금 받은 파일을 선택하세요
    </div>

    <div id="list" class="list">
      <div class="empty">불러오는 중...</div>
    </div>
  </div>

  <script>
    const OWNER = "getontop79-a11y";
    const REPO = "vocab-word-sets";
    const PATH = "words";

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      return (bytes / 1024).toFixed(1) + " KB";
    }

    async function load() {
      const listEl = document.getElementById("list");
      try {
        const res = await fetch(
          `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`
        );
        if (!res.ok) throw new Error("목록을 불러오지 못했어요");
        const files = await res.json();
        const validFiles = (Array.isArray(files) ? files : [])
          .filter((f) => f.type === "file" && /\.(txt|csv)$/i.test(f.name))
          .sort((a, b) => b.name.localeCompare(a.name));

        if (validFiles.length === 0) {
          listEl.innerHTML = '<div class="empty">아직 올라온 자료가 없어요</div>';
          return;
        }

        listEl.innerHTML = validFiles
          .map(
            (f) => `
            <div class="card">
              <div>
                <div class="name">${f.name}</div>
                <div class="meta">${formatSize(f.size)}</div>
              </div>
              <a class="btn" href="${f.download_url}" download>다운로드</a>
            </div>
          `
          )
          .join("");
      } catch (e) {
        listEl.innerHTML = '<div class="error">목록을 불러오지 못했어요. 잠시 후 다시 시도해주세요.</div>';
      }
    }

    load();
  </script>
</body>
</html>
