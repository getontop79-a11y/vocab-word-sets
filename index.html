<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>아르떼보카 자료실</title>
<style>
  :root {
    --primary: #E8558B;
    --primary-dark: #C13D6D;
    --accent: #FFC93C;
    --background: #FFF8EE;
    --surface: #FFFFFF;
    --text-primary: #1B1D2A;
    --text-secondary: #6B7280;
    --border: #F1E3CC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--background);
    color: var(--text-primary);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-size: 24px;
    font-weight: 800;
    margin: 8px 0 4px;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 20px;
  }
  .guide {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }
  .guide b { color: var(--text-primary); }
  h2 {
    font-size: 16px;
    font-weight: 800;
    margin: 28px 0 10px;
  }
  .list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .card .name {
    font-weight: 700;
    font-size: 15px;
    word-break: break-all;
  }
  .card .meta {
    color: var(--text-secondary);
    font-size: 12px;
    margin-top: 2px;
  }
  .btn {
    flex-shrink: 0;
    background: var(--primary);
    color: white;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .btn:active { background: var(--primary-dark); }
  .empty, .error {
    text-align: center;
    color: var(--text-secondary);
    padding: 40px 0;
    font-size: 14px;
  }
  .chip {
    display: inline-block;
    background: var(--accent);
    color: var(--text-primary);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 6px;
  }
  details.month {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  details.month + details.month { margin-top: 10px; }
  details.month summary {
    list-style: none;
    cursor: pointer;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    font-size: 15px;
  }
  details.month summary::-webkit-details-marker { display: none; }
  details.month summary::after {
    content: "▾";
    color: var(--text-secondary);
    transition: transform 0.15s;
    margin-left: 8px;
  }
  details.month[open] summary::after { transform: rotate(180deg); }
  details.month .month-body {
    padding: 0 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tier-card {
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .tier-card .name { font-weight: 700; font-size: 14px; }
  .tier-card .meta { color: var(--text-secondary); font-size: 11px; margin-top: 2px; }
  .month-loading, .month-error {
    color: var(--text-secondary);
    font-size: 13px;
    padding: 4px 4px 12px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>📚 아르떼보카 자료실</h1>
    <p class="subtitle">선생님이 올려주신 단어 자료를 다운로드하세요</p>

    <div class="guide">
      <b>사용 방법</b><br>
      1. 아래에서 원하는 자료를 눌러 다운로드하세요<br>
      2. <b>아르떼보카</b> 앱을 열고 "지정 단어" → 오른쪽 위 아이콘(가져오기) → "파일에서 불러오기"를 눌러 방금 받은 파일을 선택하세요<br>
      3. 링크를 직접 붙여넣고 싶다면 파일 카드를 눌러 열리는 페이지의 주소를 복사해서 앱의 "링크로 가져오기"에 붙여넣어도 돼요
    </div>

    <h2>🗓️ 월별 보카챌린지 세트</h2>
    <div id="months" class="list">
      <div class="empty">불러오는 중...</div>
    </div>

    <h2>📌 고정 자료</h2>
    <div id="list" class="list">
      <div class="empty">불러오는 중...</div>
    </div>
  </div>

  <script>
    const OWNER = "getontop79-a11y";
    const REPO = "vocab-word-sets";
    const PATH = "words";

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      return (bytes / 1024).toFixed(1) + " KB";
    }

    async function fetchDir(path) {
      const res = await fetch(
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(path).replace(/%2F/g, "/")}`
      );
      if (!res.ok) throw new Error("목록을 불러오지 못했어요");
      return res.json();
    }

    // 파일 이름 앞부분(예: "초등저학년_홉90.txt")에서 학년대/코스를 보기 좋게 뽑아낸다.
    function describeTierFile(name) {
      const withoutExt = name.replace(/\.(txt|csv)$/i, "");
      const parts = withoutExt.split("_");
      const tierPart = parts.pop() || "";
      const band = parts.join("_");
      const tierMatch = tierPart.match(/^(홉|스텝|점프)(\d+)?$/);
      if (!tierMatch) return { title: withoutExt, meta: "" };
      const tierNames = { 홉: "홉 코스", 스텝: "스텝 코스", 점프: "점프 코스" };
      const count = tierMatch[2] ? `${tierMatch[2]}개` : "";
      return { title: `${band} · ${tierNames[tierMatch[1]]}`, meta: count };
    }

    async function loadTierFiles(dirPath, bodyEl) {
      try {
        const files = await fetchDir(dirPath);
        const validFiles = (Array.isArray(files) ? files : [])
          .filter((f) => f.type === "file" && /\.(txt|csv)$/i.test(f.name))
          .sort((a, b) => a.name.localeCompare(b.name));
        if (validFiles.length === 0) {
          bodyEl.innerHTML = '<div class="month-error">이 달에는 아직 자료가 없어요</div>';
          return;
        }
        bodyEl.innerHTML = validFiles
          .map((f) => {
            const d = describeTierFile(f.name);
            return `
              <div class="tier-card">
                <div>
                  <div class="name">${d.title}</div>
                  <div class="meta">${d.meta}${d.meta ? " · " : ""}${formatSize(f.size)}</div>
                </div>
                <a class="btn" href="${f.download_url}" download>다운로드</a>
              </div>
            `;
          })
          .join("");
      } catch (e) {
        bodyEl.innerHTML = '<div class="month-error">목록을 불러오지 못했어요. 잠시 후 다시 시도해주세요.</div>';
      }
    }

    // 지금이 실제로 몇 년 몇 월인지에 따라 "이번 달" 폴더를 찾는다(목록의
    // 첫 번째가 아니라) — 시간이 지나도 페이지가 알아서 그 달 것만 보여주게.
    function pickCurrentMonth(dirs) {
      const now = new Date();
      const nowOrder = now.getFullYear() * 100 + (now.getMonth() + 1);
      const exact = dirs.find((d) => d.order === nowOrder);
      if (exact) return exact;
      const past = dirs.filter((d) => d.order <= nowOrder).sort((a, b) => b.order - a.order);
      if (past.length > 0) return past[0];
      return dirs.slice().sort((a, b) => a.order - b.order)[0] || null;
    }

    async function loadMonths() {
      const monthsEl = document.getElementById("months");
      try {
        const entries = await fetchDir(PATH);
        const dirs = (Array.isArray(entries) ? entries : [])
          .filter((f) => f.type === "dir")
          // "2026년 9월" 형태를 연/월 숫자로 뽑아 시간순 정렬
          .map((f) => {
            const m = f.name.match(/(\d+)년\s*(\d+)월/);
            const order = m ? parseInt(m[1]) * 100 + parseInt(m[2]) : 0;
            return { ...f, order };
          })
          .sort((a, b) => a.order - b.order);

        if (dirs.length === 0) {
          monthsEl.innerHTML = '<div class="empty">아직 월별 세트가 없어요</div>';
          return;
        }

        const current = pickCurrentMonth(dirs);
        const rest = dirs.filter((d) => d !== current);

        monthsEl.innerHTML = `
          <details class="month" data-path="${PATH}/${current.name}" open>
            <summary>${current.name}<span class="chip">이번 달</span></summary>
            <div class="month-body"><div class="month-loading">불러오는 중...</div></div>
          </details>
          ${
            rest.length > 0
              ? `<details class="month" id="otherMonths">
                  <summary>다른 달 자료 보기</summary>
                  <div class="month-body" id="otherMonthsBody"></div>
                </details>`
              : ""
          }
        `;

        const currentEl = monthsEl.querySelector("details.month");
        loadTierFiles(currentEl.dataset.path, currentEl.querySelector(".month-body"));

        const otherEl = document.getElementById("otherMonths");
        if (otherEl) {
          otherEl.addEventListener(
            "toggle",
            function handler() {
              if (!otherEl.open) return;
              otherEl.removeEventListener("toggle", handler);
              const body = document.getElementById("otherMonthsBody");
              body.innerHTML = rest
                .map(
                  (d) => `
                  <details class="month" data-path="${PATH}/${d.name}">
                    <summary>${d.name}</summary>
                    <div class="month-body"><div class="month-loading">눌러서 펼치면 목록을 불러와요...</div></div>
                  </details>
                `
                )
                .join("");
              body.querySelectorAll("details.month").forEach((el) => {
                el.addEventListener(
                  "toggle",
                  function innerHandler() {
                    if (!el.open) return;
                    el.removeEventListener("toggle", innerHandler);
                    loadTierFiles(el.dataset.path, el.querySelector(".month-body"));
                  }
                );
              });
            }
          );
        }
      } catch (e) {
        monthsEl.innerHTML = '<div class="error">목록을 불러오지 못했어요. 잠시 후 다시 시도해주세요.</div>';
      }
    }

    async function loadFixed() {
      const listEl = document.getElementById("list");
      try {
        const files = await fetchDir(PATH);
        const validFiles = (Array.isArray(files) ? files : [])
          .filter((f) => f.type === "file" && /\.(txt|csv)$/i.test(f.name))
          .sort((a, b) => b.name.localeCompare(a.name));

        if (validFiles.length === 0) {
          listEl.innerHTML = '<div class="empty">아직 올라온 자료가 없어요</div>';
          return;
        }

        listEl.innerHTML = validFiles
          .map(
            (f) => `
            <div class="card">
              <div>
                <div class="name">${f.name}</div>
                <div class="meta">${formatSize(f.size)}</div>
              </div>
              <a class="btn" href="${f.download_url}" download>다운로드</a>
            </div>
          `
          )
          .join("");
      } catch (e) {
        listEl.innerHTML = '<div class="error">목록을 불러오지 못했어요. 잠시 후 다시 시도해주세요.</div>';
      }
    }

    loadMonths();
    loadFixed();
  </script>
</body>
</html>
